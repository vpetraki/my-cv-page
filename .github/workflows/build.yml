
name: Build and deploy CV website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cv-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install PyYAML

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-liberation

      - name: Generate CV PDF
        env:
          CV_FONT: Liberation Sans
        run: python build_cv.py

      - name: Verify generated PDF
        run: test -s VasilikiPetraki.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Copy PDF to website
        run: |
          cp VasilikiPetraki.pdf _site/
          test -s _site/VasilikiPetraki.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: VasilikiPetraki-PDF
          path: VasilikiPetraki.pdf

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
